name: Build Peeler APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android cmdline-tools
        run: |
          set -e
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Accept licenses and install SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "platform-tools"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Grant gradlew exec permission
        run: chmod +x Peeler-main/gradlew

      - name: Build debug APK
        working-directory: Peeler-main
        run: ./gradlew assembleDebug --no-daemon --console=plain
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: peeler-apk
          path: Peeler-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
